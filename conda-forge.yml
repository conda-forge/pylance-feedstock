conda_build:
  error_overlinking: false
conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
test: native_and_emulated
workflow_settings:
  build_workspace_dir:
    - os: win
      value: C:\bld
  free_disk_space:
    - provider: azure
      value: quick
  tools_install_dir:
    - os: win
      value: C:\Miniforge
provider:
  linux_aarch64: default
  osx_arm64: default
